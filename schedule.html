<style>
  body { margin: 0; background: #faf9f6; font-family: 'DM Sans', system-ui, sans-serif; }
  .site-bar { background: #0d1b2e; color: #fff; }
  .site-bar-inner { max-width: 1200px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .site-bar a { color: #fff; text-decoration: none; font-size: .9rem; letter-spacing: .02em; }
  .site-bar a:hover { color: #e8a020; }
  .site-bar .brand { font-family: 'Spectral', Georgia, serif; font-weight: 600; font-size: 1.05rem; }
  .site-bar .back { display: inline-flex; align-items: center; gap: 6px; background: #c8922e; padding: 6px 12px; border-radius: 4px; font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; }
  .site-bar .back:hover { background: #e8a020; color: #fff; }
  .site-foot { text-align: center; padding: 8px 16px 40px; font-size: .85rem; color: #646b78; }
  .site-foot a { color: #c8922e; }

  /* ===== Everything below is scoped to .rs / .rs-tip so it won't clash with your site ===== */
  .rs, .rs-tip {
    --ink: #1b2a4a; --muted: #646b78; --line: #dedcd5; --rail: #ffffff;
    --talk: #2f6fd6;      --talk-bg: #eaf1fd;
    --workshop: #7a4fd0;  --workshop-bg: #f1ebfc;
    --exercise: #1b9470;  --exercise-bg: #e4f5ee;
    --leisure: #db7417;   --leisure-bg: #fdf0e2;
    --break: #9aa0a6;     --break-bg: #f1f0ec;
    font-family: 'DM Sans', system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .rs { color: var(--ink); font-size: 15px; line-height: 1.35; max-width: 1200px; margin: 0 auto; padding: 32px 16px 48px; }
  .rs *, .rs *::before, .rs *::after { box-sizing: border-box; }
  .rs h1, .rs-tip h3 { font-family: 'Spectral', Georgia, serif; }
  .rs h1 { font-size: 1.75rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .rs .rs-sub { color: var(--muted); margin: 0 0 20px; }
  .rs h1 { text-wrap: balance; }

  /* Legend / filters */
  .rs-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .rs-chip {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 0.85rem; transition: opacity .15s;
  }
  .rs-chip .dot { width: 10px; height: 10px; border-radius: 50%; }
  .rs-chip[aria-pressed="false"] { opacity: .45; }
  .rs-hint { color: var(--muted); font-size: 0.8rem; align-self: center; margin-left: 4px; }

  /* Grid view */
  .rs-grid { display: grid; grid-template-columns: 56px repeat(5, minmax(0, 1fr)); column-gap: 10px; }
  .rs-rail { background: var(--rail); border-radius: 12px; box-shadow: 0 1px 2px rgba(20,25,40,.06); }
  .rs-dayhead { padding: 12px 12px 10px; text-align: center; z-index: 1; }
  .rs-dayhead b { display: block; font-size: 1rem; }
  .rs-dayhead span { color: var(--muted); font-size: 0.82rem; }
  .rs-tick { border-top: 1px dashed var(--line); z-index: 0; pointer-events: none; }
  .rs-time { color: var(--muted); font-size: 0.75rem; font-variant-numeric: tabular-nums; text-align: right; transform: translateY(-0.6em); z-index: 1; }

  .rs-s {
    position: relative; z-index: 2; margin: 3px 6px; border-radius: 8px; padding: 8px 10px 10px;
    background: var(--c-bg); border-top: 4px solid var(--c);
    transition: transform .12s, box-shadow .12s, opacity .15s; outline: none; min-width: 0;
  }
  .rs-s.has-info { cursor: pointer; }
  .rs-s.has-info:hover, .rs-s.has-info:focus-visible, .rs-s.active {
    transform: translateY(-1px); box-shadow: 0 6px 18px rgba(20, 25, 40, .14);
  }
  .rs-s .tm { font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rs-s .cat { font-size: 0.66rem; text-transform: uppercase; letter-spacing: .06em; color: var(--c); font-weight: 700; float: right; margin-left: 6px; }
  .rs-s .t { font-weight: 600; font-size: 0.9rem; overflow-wrap: anywhere; margin-top: 3px; clear: both; }
  .rs-s .sp { color: var(--muted); font-size: 0.8rem; margin-top: 4px; }
  .rs-s .loc, .rs-tip .loc { font-size: 0.78rem; margin-top: 4px; }
  .rs-s .loc a, .rs-tip .loc a { color: var(--c); text-decoration: none; }
  .rs-s .loc a:hover, .rs-tip .loc a:hover { text-decoration: underline; }
  .rs-s .loc svg, .rs-tip .loc svg { vertical-align: -1px; margin-right: 3px; }
  .rs-tip .loc { margin: 0 0 8px; }
  .rs-s.break { border-top: 0; background: var(--break-bg); padding: 4px 10px; display: flex; align-items: center; justify-content: center; }
  .rs-s.break .t { font-weight: 500; font-size: 0.78rem; color: var(--muted); margin: 0; }
  .rs-s.dim { opacity: .18; }
  .rs-tbc {
    display: inline-block; font-size: 0.64rem; font-weight: 700; letter-spacing: .04em;
    background: #fff3b0; color: #6b5800; border-radius: 4px; padding: 1px 5px; margin-left: 4px; vertical-align: 1px;
  }

  /* List view (phones) */
  .rs-list { display: none; }
  .rs-list section { background: var(--rail); border-radius: 12px; padding: 4px 6px 8px; margin-top: 16px; }
  .rs-list h2 { font-size: 1.05rem; margin: 10px 8px 6px; }
  .rs-list h2 span { color: var(--muted); font-weight: 400; font-size: 0.9rem; }
  .rs-list .rs-s { margin: 6px 2px; }

  @media (max-width: 820px) {
    .rs-grid { display: none; }
    .rs-list { display: block; }
  }

  /* Hover card – solid white background */
  .rs-tip {
    position: fixed; z-index: 9999; width: min(340px, calc(100vw - 24px));
    background: #ffffff; color: #1d2330; border-radius: 12px;
    box-shadow: 0 14px 40px rgba(20, 25, 40, .25), 0 0 0 1px rgba(20,25,40,.06); border-top: 5px solid var(--c, #888);
    padding: 14px 16px 16px; font-size: 0.88rem; line-height: 1.4; max-height: calc(100vh - 20px); overflow-y: auto; opacity: 0; pointer-events: none;
    transform: translateY(4px); transition: opacity .12s, transform .12s;
  }
  .rs-tip.show { opacity: 1; transform: none; pointer-events: auto; }
  .rs-tip .cat { font-size: 0.68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--c); font-weight: 700; }
  .rs-tip h3 { margin: 3px 0 2px; font-size: 1rem; line-height: 1.3; }
  .rs-tip .when { color: #646b78; font-size: 0.8rem; margin-bottom: 8px; }
  .rs-tip .desc { margin: 0 0 8px; }
  .rs-tip .person { display: flex; gap: 10px; padding-top: 10px; margin-top: 10px; border-top: 1px solid #ecebe6; }
  .rs-tip .person:first-of-type { border-top: 0; margin-top: 0; }
  .rs-tip .ph { flex: none; width: 56px; height: 56px; border-radius: 50%; background: var(--c-bg); color: var(--c);
    display: flex; align-items: center; justify-content: center; font-weight: 700; overflow: hidden; }
  .rs-tip .ph img { width: 100%; height: 100%; object-fit: cover; }
  .rs-tip .nm { font-weight: 650; }
  .rs-tip .af { color: #646b78; font-size: 0.8rem; }
  .rs-tip .bio { margin-top: 4px; }
  .rs-tip .rs-tbc { display: inline-block; font-size: 0.64rem; font-weight: 700; background: #fff3b0; color: #6b5800; border-radius: 4px; padding: 1px 5px; margin-left: 4px; }
</style>

  mattsson: {"name": "Pauline Mattsson", "affiliation": "School of Economics and Management, Lund University", "photo": "", "bio": "Pauline Mattsson is an Associate Professor at the School of Economics and Management, Lund University, specializing in Science and Technology Policy and R&D Management. Her research and teaching focus on the intersection of innovation, policy, and societal transformation. She explores how research environments shape the capacity for groundbreaking, high-risk discovery, and how such innovations translate into real-world impact."},

(function () {
  const root = document.getElementById("rs-schedule");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
  const dayIdx = Object.fromEntries(CONFIG.days.map((d, i) => [d.key, i]));
  const timeLabel = s => s.openEnd ? `from ${s.start}` : `${s.start} – ${s.end}`;
  const colorVars = cat => `--c:var(--${cat});--c-bg:var(--${cat}-bg)`;
  const TBC = `<span class="rs-tbc">TBC</span>`;
  const PIN = `<svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>`;
  const locLink = s => s.mapUrl
    ? `<a href="${esc(s.mapUrl)}" target="_blank" rel="noopener">${PIN}${esc(s.location)}</a>`
    : `${PIN}${esc(s.location)}`;

  SESSIONS.forEach((s, i) => s._id = i);

  // Rows come from every start/end boundary
  const bounds = [...new Set(SESSIONS.flatMap(s => [s.start, s.end]))].sort((a, b) => toMin(a) - toMin(b));
  const rows = bounds.slice(0, -1).map((t, i) => ({ start: t, end: bounds[i + 1] }));
  const rowOf = t => bounds.indexOf(t);
  const covered = rows.map(r => SESSIONS.some(s => toMin(s.start) <= toMin(r.start) && toMin(s.end) >= toMin(r.end)));
  const rowHeights = rows.map((r, i) => {
    if (!covered[i]) return "26px";
    const mins = toMin(r.end) - toMin(r.start);
    return `minmax(${Math.min(110, Math.max(32, Math.round(mins * 1.15)))}px, auto)`;
  });

  const speakerLine = s => {
    const names = (s.speakers || []).map(id => SPEAKERS[id]?.name).filter(Boolean).join(" & ");
    return names ? esc(s.speakerPrefix || "") + esc(names) + (s.speakerTbc ? TBC : "") : "";
  };

  const card = (s, extraStyle = "") => {
    if (s.cat === "break") {
      return `<div class="rs-s break" data-cat="break" style="${colorVars("break")};${extraStyle}"><div class="t">${esc(s.title)}</div></div>`;
    }
    const sp = speakerLine(s);
    return `<div class="rs-s has-info" tabindex="0" data-id="${s._id}" data-cat="${s.cat}" style="${colorVars(s.cat)};${extraStyle}">
        <span class="cat">${esc(CATEGORIES[s.cat]?.label)}</span>
        <div class="tm">${timeLabel(s)}</div>
        <div class="t">${esc(s.title)}${s.tbc ? TBC : ""}</div>
        ${sp ? `<div class="sp">${sp}</div>` : ""}
        ${s.location ? `<div class="loc">${locLink(s)}</div>` : ""}
      </div>`;
  };

  // Header + legend
  let html = `<h1>${esc(CONFIG.title)}</h1><p class="rs-sub">${esc(CONFIG.subtitle)}</p><div class="rs-legend">`;
  for (const [key, c] of Object.entries(CATEGORIES)) {
    if (key === "break") continue;
    html += `<button class="rs-chip" type="button" aria-pressed="true" data-filter="${key}"><span class="dot" style="background:var(--${key})"></span>${esc(c.label)}</button>`;
  }
  html += `<span class="rs-hint">Hover or tap a session for speaker details</span></div>`;

  // Grid view: day rails (vertical columns), time ticks, then sessions on top
  const lastRow = rows.length + 2;
  html += `<div class="rs-grid" style="grid-template-rows:auto ${rowHeights.join(" ")} 12px">`;
  CONFIG.days.forEach((d, i) => {
    html += `<div class="rs-rail" style="grid-column:${i + 2};grid-row:1/${lastRow + 1}"></div>`;
    html += `<div class="rs-dayhead" style="grid-column:${i + 2};grid-row:1"><b>${esc(d.label)}</b><span>${esc(d.date)}</span></div>`;
  });
  rows.forEach((r, i) => {
    html += `<div class="rs-tick" style="grid-column:1/-1;grid-row:${i + 2}"></div>`;
    html += `<div class="rs-time" style="grid-column:1;grid-row:${i + 2}">${r.start}</div>`;
  });
  SESSIONS.forEach(s => {
    const col = dayIdx[s.day] + 2, r0 = rowOf(s.start) + 2, r1 = rowOf(s.end) + 2;
    html += card(s, `grid-column:${col};grid-row:${r0}/${r1}`);
  });
  html += `</div>`;

  // List view (phones)
  html += `<div class="rs-list">`;
  CONFIG.days.forEach(d => {
    html += `<section><h2>${esc(d.label)} <span>${esc(d.date)}</span></h2>`;
    SESSIONS.filter(s => s.day === d.key).sort((a, b) => toMin(a.start) - toMin(b.start)).forEach(s => html += card(s));
    html += `</section>`;
  });
  html += `</div>`;
  root.innerHTML = html;

  // Category filters
  const active = new Set(Object.keys(CATEGORIES));
  root.querySelectorAll(".rs-chip").forEach(btn => btn.addEventListener("click", () => {
    const k = btn.dataset.filter;
    active.has(k) ? active.delete(k) : active.add(k);
    btn.setAttribute("aria-pressed", active.has(k));
    root.querySelectorAll(".rs-s.has-info").forEach(el => el.classList.toggle("dim", !active.has(el.dataset.cat)));
  }));

  // Hover card
  const tip = document.createElement("div");
  tip.className = "rs-tip";
  tip.setAttribute("role", "tooltip");
  document.body.appendChild(tip);
  let current = null, hideTimer = null;

  const initials = n => n.split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
  const fill = s => {
    const d = CONFIG.days[dayIdx[s.day]];
    let h = `<div class="cat">${esc(CATEGORIES[s.cat]?.label)}</div>
             <h3>${esc(s.title)}${s.tbc ? TBC : ""}</h3><div class="when">${esc(d.label)} ${esc(d.date)} · ${timeLabel(s)}</div>`;
    if (s.location) h += `<p class="loc">${locLink(s)}${s.mapUrl ? ` · <a href="${esc(s.mapUrl)}" target="_blank" rel="noopener">Open in Google Maps</a>` : ""}</p>`;
    if (s.description) h += `<p class="desc">${esc(s.description)}</p>`;
    (s.speakers || []).forEach(id => {
      const p = SPEAKERS[id]; if (!p) return;
      h += `<div class="person"><div class="ph" data-fallback="${esc(p.initials || initials(p.name))}">${p.photo ? `<img src="${esc(p.photo)}" alt="${esc(p.name)}">` : esc(p.initials || initials(p.name))}</div>
              <div><div class="nm">${esc(s.speakerPrefix || "")}${esc(p.name)}${s.speakerTbc ? TBC : ""}</div>${p.affiliation ? `<div class="af">${esc(p.affiliation)}</div>` : ""}
              <div class="bio">${esc(p.bio)}</div></div></div>`;
    });
    tip.innerHTML = h;
    tip.querySelectorAll(".ph img").forEach(img => img.addEventListener("error", () => { const ph = img.parentNode; ph.textContent = ph.dataset.fallback; }));
    tip.style.cssText = colorVars(s.cat);
  };
  const place = el => {
    const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight, m = 10;
    let left = r.right + m, side = true;
    if (left + tw > innerWidth - m) left = r.left - tw - m;
    if (left < m) { left = Math.min(Math.max(m, r.left), innerWidth - tw - m); side = false; }
    let top = side ? r.top : r.bottom + m;
    if (top + th > innerHeight - m) top = Math.max(m, innerHeight - th - m);
    tip.style.left = left + "px"; tip.style.top = top + "px";
  };
  const show = el => {
    clearTimeout(hideTimer);
    if (current && current !== el) current.classList.remove("active");
    current = el; el.classList.add("active");
    fill(SESSIONS[+el.dataset.id]);
    tip.classList.add("show"); place(el);
  };
  const hide = () => { tip.classList.remove("show"); if (current) current.classList.remove("active"); current = null; };
  const hideSoon = () => { hideTimer = setTimeout(hide, 120); };

  root.querySelectorAll(".rs-s.has-info").forEach(el => {
    el.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") show(el); });
    el.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") hideSoon(); });
    el.addEventListener("focus", () => show(el));
    el.addEventListener("blur", hideSoon);
    el.addEventListener("click", e => {
      e.stopPropagation();
      if (e.pointerType !== "mouse" && current === el && tip.classList.contains("show")) hide(); else show(el);
    });
    el.addEventListener("keydown", e => { if (e.key === "Escape") { hide(); el.blur(); } });
  });
  tip.addEventListener("pointerenter", () => clearTimeout(hideTimer));
  tip.addEventListener("pointerleave", hideSoon);
  document.addEventListener("click", e => { if (!tip.contains(e.target)) hide(); });
  addEventListener("scroll", () => current && place(current), { passive: true });
  addEventListener("resize", () => current && place(current));
})();
</script>
</body>
</html>
